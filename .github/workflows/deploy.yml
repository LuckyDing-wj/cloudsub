name: Deploy to Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Migrations must land before the new code is served.
      - run: npx wrangler d1 migrations apply DB --remote
      # Workers asset uploads occasionally race (workers-sdk #7555); one
      # retry keeps a flake from failing the whole deployment.
      - run: npx wrangler deploy || (sleep 10 && npx wrangler deploy)
